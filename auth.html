<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Student Login | Forex & Coding Bulls</title><link rel="stylesheet" href="styles.css"></head><body><main class="auth-wrap"><div class="auth-card"><a class="brand" href="index.html">FOREX <span>&</span> CODING BULLS</a><div class="tabs"><button id="loginTab" class="active" onclick="setMode('login')">Login</button><button id="signupTab" onclick="setMode('signup')">Create account</button></div><div id="authMsg" class="notice" hidden></div><form id="loginForm"><h1>Welcome back</h1><label>Email<input id="loginEmail" type="email" required></label><label>Password<input id="loginPassword" type="password" required></label><button class="btn btn-primary">Login</button><p class="small">Admin accounts use the same secure login. Admin status is controlled in the database, not in the website code.</p></form><form id="signupForm" hidden><h1>Create student account</h1><label>Full name<input id="fullName" required></label><label>Phone<input id="phone" placeholder="07XXXXXXXX" required></label><label>Email<input id="email" type="email" required></label><label>Password<input id="password" type="password" minlength="8" required></label><button class="btn btn-primary">Create account</button><p class="small">Use a real email address you can access if email confirmation is enabled.</p></form><a class="small" href="index.html">← Back to academy</a></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script src="app.js"></script><script>function setMode(m){const l=m==='login';document.getElementById('loginForm').hidden=!l;document.getElementById('signupForm').hidden=l;document.getElementById('loginTab').classList.toggle('active',l);document.getElementById('signupTab').classList.toggle('active',!l)}if(new URLSearchParams(location.search).get('mode')==='signup')setMode('signup');</script></body></html>
